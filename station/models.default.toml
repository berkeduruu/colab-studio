# Model catalog: which Hugging Face files each mode downloads to the GPU runtime and which file
# fills each slot of its ComfyUI workflow.
#
# Do not edit this file. Copy it to `models.toml` in the repository root (or point STUDIO_MODELS at
# another path) and edit that copy; it is read when the studio starts and sent to the runtime on
# every GPU start. Restart the studio after editing.
#
#   repo  Hugging Face repository ("owner/name")
#   file  path of the file inside the repository
#   dir   folder under ComfyUI/models/ the file is placed in (the workflow loads it by file name)
#
# A replacement must be the same architecture as the default: the workflows are fixed graphs.
# Models are downloaded anonymously unless HF_TOKEN is set in .env (needed for gated repos).

# Image generation and editing. Slots must stay Qwen-Image 2.1 compatible.
# Example: the official base model instead of Noct-Q:
#   diffusion_model = { repo = "Comfy-Org/Qwen-Image-2.1", file = "diffusion_models/qwen_image_2.1_int8_convrot.safetensors", dir = "diffusion_models" }
[image]
label = "Noct-Q V4"
description.en = "Qwen-Image 2.1 based uncensored fine-tune. Strong text rendering and prompt following."
description.tr = "Qwen-Image 2.1 tabanlı, sansürsüz ince ayar. Metin yazımı ve istem takibi güçlü."
[image.files]
diffusion_model = { repo = "Noctaluna/Noct-Q-Uncensored-Qwen-Image-2.1", file = "NoctQ_V4_int8_convrot.safetensors", dir = "diffusion_models" }
text_encoder = { repo = "Comfy-Org/Qwen-Image-2.1", file = "text_encoders/qwen3vl_8b_int8_convrot.safetensors", dir = "text_encoders" }
vae = { repo = "Comfy-Org/Qwen-Image-2.1", file = "vae/qwen_image_2.1_vae_bf16.safetensors", dir = "vae" }
turbo_lora = { repo = "Comfy-Org/Qwen-Image-2.1", file = "loras/qwen_image_2.1_turbo_lora_avg_rank_178_bf16.safetensors", dir = "loras" }

# "Enhance prompt" button.
[enhance]
label = "Qwen3.5 9B prompt enhancer"
description.en = "Rewrites short prompts into detailed ones (separate models for generation and editing)."
description.tr = "Kısa istemleri ayrıntılı istemlere çevirir (üretim ve düzenleme için ayrı modeller)."
[enhance.files]
prompt_enhancer_t2i = { repo = "Comfy-Org/Qwen-Image-2.1", file = "text_encoders/qwen3.5_9b_qwen_image_2.1_pe_t2i.int8_convrot.safetensors", dir = "text_encoders" }
prompt_enhancer_i2i = { repo = "Comfy-Org/Qwen-Image-2.1", file = "text_encoders/qwen3.5_9b_qwen_image_2.1_pe_i2i.int8_convrot.safetensors", dir = "text_encoders" }

# Video (with audio). The smallest variants that fit the L4's 24 GB.
[video]
label = "MiniMax H3 (w6a8)"
description.en = "MiniMax H3: generates video and audio (speech, effects, music) together. 24 fps."
description.tr = "MiniMax H3: görüntü ve sesi (konuşma, efekt, müzik) birlikte üretir. 24 fps."
[video.files]
diffusion_model = { repo = "Comfy-Org/MiniMax-H3", file = "diffusion_models/minimax_h3_fl2va_pruned_w6a8.safetensors", dir = "diffusion_models" }
text_encoder = { repo = "Comfy-Org/MiniMax-H3", file = "text_encoders/qwen3vl_32b_minimax_h3_nvfp4_awq.safetensors", dir = "text_encoders" }
video_vae = { repo = "Comfy-Org/MiniMax-H3", file = "vae/minimax_h3_video_vae_int8_convrot.safetensors", dir = "vae" }
audio_vae = { repo = "Comfy-Org/MiniMax-H3", file = "vae/minimax_h3_audio_vae_fp32.safetensors", dir = "vae" }
turbo_lora = { repo = "Comfy-Org/MiniMax-H3", file = "loras/minimax_h3_fl2v_turbo_8step_v1.0_comfyui_bf16.safetensors", dir = "loras" }

# Image to 3D.
[model3d]
label = "TRELLIS.2"
description.en = "Microsoft TRELLIS.2 (MIT): a textured 3D model (GLB) from a single image. The background is removed automatically with BiRefNet; a clear, single, fully visible object works best."
description.tr = "Microsoft TRELLIS.2 (MIT lisans): tek görselden dokulu 3D model (GLB) üretir. Arka plan BiRefNet ile otomatik ayrılır; nesnenin net, tek ve tamamen görünür olduğu görseller en iyi sonucu verir."
[model3d.files]
diffusion_model = { repo = "Comfy-Org/TRELLIS.2", file = "diffusion_models/trellis_2_int8_convrot.safetensors", dir = "diffusion_models" }
clip_vision = { repo = "Comfy-Org/TRELLIS.2", file = "clip_vision/dino_v3_vit_l.safetensors", dir = "clip_vision" }
shape_vae = { repo = "Comfy-Org/TRELLIS.2", file = "vae/trellis_2_shape_vae_bf16.safetensors", dir = "vae" }
texture_vae = { repo = "Comfy-Org/TRELLIS.2", file = "vae/trellis_2_texture_vae_bf16.safetensors", dir = "vae" }
background_removal = { repo = "Comfy-Org/BiRefNet", file = "background_removal/birefnet.safetensors", dir = "background_removal" }

# Music.
[music]
label = "YuE2"
description.en = "YuE2 3B: songs with vocals from a style and lyrics. Multilingual."
description.tr = "YuE2 3B: tarz ve sözlerden vokalli şarkı üretir. Çok dilli; Türkçe sözler deneysel."
[music.files]
checkpoint = { repo = "Comfy-Org/YuE2", file = "checkpoints/yue2_3b_bf16.safetensors", dir = "checkpoints" }

# Text to speech. The Qwen3-TTS plugin loads these folders by name, so they are plain downloads
# ([[speech.extra]]) rather than workflow slots.
[speech]
label = "Qwen3-TTS 1.7B"
description.en = "Qwen3-TTS: preset voices (CustomVoice) and voice cloning (Base). Chatterbox downloads its own model on first use."
description.tr = "Qwen3-TTS: hazır sesler (CustomVoice) ve ses klonlama (Base). Chatterbox modelini ilk kullanımda kendisi indirir."
